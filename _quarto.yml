# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: ""
  favicon: assets/img/turtle.webp
  site-url: https://sayakkhatua.github.io
  repo-url: https://github.com/sayakkhatua/sayakkhatua.github.io
  page-navigation: true
  #back-to-top-navigation: true

  # Social share cards (Open Graph + Twitter/X). These control the preview
  # image, title, and blurb shown when the site is shared in Slack, on X,
  # LinkedIn, etc. `image` and `description` are the site-wide defaults.
  image: assets/img/sayak.png
  description: "Sayak Khatua — economist and incoming Postdoctoral Research Fellow at the Centre for the Study of African Economies, University of Oxford. Research on the economics of education, child labor, climate change, program evaluation, and research transparency."
  open-graph: true
  twitter-card: true
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: assets/img/turtle.webp
    
    # your sub-pages
    right:
      - text: Home
        aria-label: "Home"
        href: "index.qmd"
      # About page is built but intentionally kept out of the navbar for now.
      #- text: About
      #  aria-label: "About"
      #  href: "about.qmd"
      - text: Research
        aria-label: "Research"
        href: "research/research.qmd"
      - text: Publications
        aria-label: "Publications"
        href: "publications/pubs.qmd"
      - text: Teaching
        aria-label: "Teaching"
        href: "teaching/teach.qmd"
      - text: CV
        aria-label: "CV"
        href: "cv/cv.qmd"

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
#    type: textbox
  page-footer:
    border: true
    left: "&#169; 2026 Sayak Khatua"
    center:
      - icon: linkedin
        href: https://www.linkedin.com/in/sayak-khatua/
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/sayakkhatua
        aria-label: GitHub
      - icon: envelope
        href: "mailto:skhatua.research@gmail.com"
        aria-label: Email
    right: "Made with [Quarto](https://quarto.org)"

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    linestretch: 1.5
    max-width: 1600px
    page-layout: full
    smooth-scroll: true
    theme:
      light:
        - cosmo
        - html/oxford-confetti.scss
        - html/publications.scss
      dark:
        - darkly
        - html/oxford-confetti-dark.scss
        - html/publications.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true